</head><body>
<title>Fromatipour Workout</title>

<style>
/* Layout: one phone-width column, a sticky top bar, a bottom tab bar; days are colour-coded like gym plates. */
:root {
  --bg: #eef0f3;
  --surface: #ffffff;
  --surface-2: #f5f6f8;
  --line: #d9dde3;
  --fg: #16181d;
  --muted: #5d6470;
  --accent: #1f2430;
  --on-accent: #ffffff;
  --max: #d22f27;          /* her "max set" red */
  --max-soft: #fbe7e5;
  --ok: #1f8a55;
  --c-ua: #5b3fa6;
  --c-ub: #2f6fd0;
  --c-la: #0d8a6a;
  --c-lb: #b5651d;
  --c-sport: #c23b5e;
  --c-lower: #0f8a8a;
  --c-upper: #4a55c9;
  --c-full: #c47a0d;
  --c-cardio: #d04673;
  --c-pilates: #7a5bb8;
  --shadow: 0 1px 2px rgba(20, 24, 32, .06), 0 4px 14px rgba(20, 24, 32, .05);
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111318; --surface: #1a1d24; --surface-2: #22262f; --line: #2f3440;
    --fg: #eef0f4; --muted: #9aa2b1; --accent: #eef0f4; --on-accent: #111318;
    --max: #ff6a5f; --max-soft: #3a1d1b; --ok: #4cc488;
    --c-ua: #a68bf0; --c-ub: #6fa3ff; --c-la: #3fc79f; --c-lb: #f09a4f; --c-sport: #ff7f9f; --c-lower: #2fb9b6; --c-upper: #8b94ff; --c-full: #f0a43a; --c-cardio: #ff7aa2; --c-pilates: #b596f2;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111318; --surface: #1a1d24; --surface-2: #22262f; --line: #2f3440;
  --fg: #eef0f4; --muted: #9aa2b1; --accent: #eef0f4; --on-accent: #111318;
  --max: #ff6a5f; --max-soft: #3a1d1b; --ok: #4cc488;
  --c-ua: #a68bf0; --c-ub: #6fa3ff; --c-la: #3fc79f; --c-lb: #f09a4f; --c-sport: #ff7f9f; --c-lower: #2fb9b6; --c-upper: #8b94ff; --c-full: #f0a43a; --c-cardio: #ff7aa2; --c-pilates: #b596f2;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--c-ua); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; line-height: 1.05; }
h1 { font-size: 2.4rem; text-transform: uppercase; }
h2 { font-size: 1.5rem; text-transform: uppercase; }
h3 { font-size: 1.2rem; }
.label { font-size: .72rem; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.red { color: var(--max); }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 10px; display: flex; align-items: center; gap: 10px; min-height: 52px; }
.top .title { flex: 1; min-width: 0; font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; height: 38px; min-width: 38px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; font-size: .88rem; }
.iconbtn.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

/* buttons */
.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 600; background: var(--accent); color: var(--on-accent); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.ghost { background: var(--surface); color: var(--fg); border: 1px solid var(--line); }
.btn.danger { background: transparent; color: var(--max); border: 1px solid var(--max); }
.btn.small { padding: 8px 12px; font-size: .88rem; border-radius: 10px; }
.btn.block { width: 100%; }
.btn.daycol { background: var(--dc); color: #fff; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > .grow { flex: 1; min-width: 0; }

/* hero */
.hero { display: flex; flex-direction: column; gap: 8px; padding-top: 6px; }
.hero h1 span { color: var(--acc, var(--max)); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: .78rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.pad { padding: 16px; }

/* week strip */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0 10px; border-radius: 10px; }
.wd .d { font-size: .7rem; font-weight: 600; color: var(--muted); text-transform: uppercase; }
.wd .n { font-weight: 600; font-variant-numeric: tabular-nums; }
.wd.today { background: var(--surface-2); outline: 1.5px solid var(--fg); }
.dots { display: flex; gap: 3px; min-height: 16px; flex-wrap: wrap; justify-content: center; }
.pip { min-width: 16px; padding: 0 2px; height: 16px; border-radius: 4px; background: var(--dc); color: #fff; font-size: .6rem; font-weight: 700; display: grid; place-items: center; line-height: 1; }

.three { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 8px; }
.guide summary { cursor: pointer; font-weight: 600; }
.guide dl { margin: 10px 0 0; display: grid; gap: 8px; font-size: .9rem; }
.guide dt { font-weight: 600; }
.guide dd { margin: 0; color: var(--muted); }
.cat { color: var(--dc); }
.tri { border-radius: 10px; padding: 8px 10px; border: 1.5px dashed var(--line); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tri.done { border: 1.5px solid var(--dc); background: color-mix(in srgb, var(--dc) 12%, transparent); }
.tri b { font-size: .86rem; }
.tri small { font-size: .74rem; color: var(--muted); }

.next { border-radius: var(--r); padding: 18px; background: var(--dc); color: #fff; display: flex; flex-direction: column; gap: 10px; }
.next .label { color: rgba(255,255,255,.85); }
.next h2 { font-size: 2rem; }
.next .btn { background: #fff; color: #16181d; align-self: flex-start; }

/* day cards */
.days { display: grid; gap: 10px; }
.day { display: grid; grid-template-columns: 8px 1fr auto; gap: 14px; align-items: center; text-align: left; padding: 14px 16px 14px 0; width: 100%; overflow: hidden; }
.day .stripe { align-self: stretch; background: var(--dc); border-radius: 0 4px 4px 0; }
.day .meta { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.day .meta p { margin: 0; font-size: .86rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.chev { color: var(--muted); font-size: 1.3rem; }
.badge { font-size: .7rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.badge.live { background: var(--ok); color: #fff; }

/* day screen */
.dayhead { border-radius: var(--r); padding: 18px; background: var(--dc); color: #fff; display: flex; flex-direction: column; gap: 12px; }
.dayhead p { margin: 0; opacity: .92; }
.dayhead .btn { background: #fff; color: #16181d; }
.dayhead .btn.ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.6); }
.progress { height: 6px; border-radius: 3px; background: rgba(255,255,255,.3); overflow: hidden; }
.progress i { display: block; height: 100%; background: #fff; }
.section { display: flex; flex-direction: column; gap: 8px; }
.section > .label { padding-left: 2px; }
.list { display: flex; flex-direction: column; gap: 8px; }
.ex { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 13px 14px; text-align: left; width: 100%; align-items: center; }
.ex .nm { font-weight: 600; min-width: 0; }
.ex .sub { font-size: .84rem; color: var(--muted); min-width: 0; }
.ex .mx { text-align: right; font-weight: 700; color: var(--max); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: .92rem; }
.ex .mx.none { color: var(--muted); font-weight: 500; font-size: .8rem; }
.ex.complete { border-color: var(--ok); }
.ex.complete .nm::before { content: "✓ "; color: var(--ok); }
.setbar { grid-column: 1 / -1; display: flex; gap: 4px; margin-top: 4px; }
.setbar i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); max-width: 40px; }
.setbar i.on { background: var(--ok); }
.ss { border-left: 4px solid var(--dc); border-radius: var(--r); padding-left: 8px; display: flex; flex-direction: column; gap: 6px; }
.ss .label { color: var(--dc); }
.editrow { display: flex; gap: 6px; align-items: stretch; }
.editrow .ex { flex: 1; min-width: 0; }
.mv { display: flex; flex-direction: column; gap: 4px; }
.mv button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 38px; flex: 1; font-size: .9rem; }
.mv button:disabled { opacity: .35; }
.linker { align-self: center; border: 1px dashed var(--line); background: transparent; border-radius: 999px; padding: 3px 12px; font-size: .76rem; font-weight: 600; color: var(--muted); }
.linker.on { border-style: solid; border-color: var(--dc); color: var(--dc); }
.add { border: 1.5px dashed var(--line); background: transparent; border-radius: var(--r); padding: 12px; font-weight: 600; color: var(--muted); }

/* exercise screen */
.panel { display: flex; flex-direction: column; gap: 14px; padding: 16px; }
.panel h2 { font-size: 1.8rem; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-size: .84rem; font-weight: 600; }
.chip.on { background: var(--dc); border-color: var(--dc); color: #fff; }
.presc { display: flex; gap: 10px; flex-wrap: wrap; }
.presc .big { font-family: var(--font-display); font-size: 1.7rem; font-weight: 700; line-height: 1; }
.notes { margin: 0; padding: 10px 12px; background: var(--surface-2); border-radius: 10px; font-size: .92rem; }
.maxbox { border-radius: 12px; padding: 14px; background: var(--max-soft); border: 1.5px solid var(--max); display: flex; flex-direction: column; gap: 10px; }
.maxbox .val { font-family: var(--font-display); font-size: 2.2rem; font-weight: 700; color: var(--max); line-height: 1; font-variant-numeric: tabular-nums; }
.maxbox .label { color: var(--max); }
.hist { font-size: .82rem; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
.field label { font-size: .76rem; font-weight: 600; color: var(--muted); }
.field input, .field textarea, .field select { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; font-size: 16px; }
.field textarea { min-height: 70px; resize: vertical; }
.sets { display: flex; gap: 8px; flex-wrap: wrap; }
.set { width: 52px; height: 52px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-variant-numeric: tabular-nums; display: grid; place-items: center; }
.set.on { background: var(--ok); border-color: var(--ok); color: #fff; }
.sstip { padding: 10px 14px; border-radius: 12px; background: color-mix(in srgb, var(--dc) 14%, transparent); border: 1px solid var(--dc); font-size: .9rem; }
.pager { display: flex; gap: 10px; }
.pager .btn { flex: 1; min-width: 0; }
.pager .btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* rest timer */
.timer { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.timer .t { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; min-width: 64px; font-variant-numeric: tabular-nums; }
.timer .t.done { color: var(--ok); }

/* calendar */
.calnav { display: flex; align-items: center; gap: 8px; }
.calnav h2 { flex: 1; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .h { text-align: center; font-size: .7rem; font-weight: 600; color: var(--muted); text-transform: uppercase; padding-bottom: 2px; }
.cell { aspect-ratio: 1 / 1.15; max-width: 100%; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 3px; padding: 5px 2px; min-width: 0; }
.cell.out { opacity: .35; }
.cell.today { outline: 2px solid var(--fg); outline-offset: -1px; }
.cell.sel { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.cell .n { font-size: .82rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: .8rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.entry { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; }
.entry .grow { flex: 1; min-width: 0; }
.entry ul { margin: 4px 0 0; padding-left: 18px; font-size: .86rem; color: var(--muted); }
.weekrow { display: grid; grid-template-columns: 92px 1fr; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: .86rem; }
.weekrow:first-of-type { border-top: 0; }

/* bottom nav */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabs button { border: 0; background: transparent; padding: 10px 0 12px; font-size: .74rem; font-weight: 600; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button.on { color: var(--fg); }

/* sheet */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(10,12,16,.5); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; border-radius: 18px 18px 0 0; padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 45; background: var(--accent); color: var(--on-accent); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: .9rem; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
/* weight input with BW toggle */
.wt { display: flex; align-items: stretch; min-width: 0; }
.wt input { border-top-left-radius: 0 !important; border-bottom-left-radius: 0 !important; }
.bw { border: 1px solid var(--line); border-right: 0; background: var(--surface-2); border-radius: 10px 0 0 10px; padding: 0 10px; font-size: .78rem; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.bw.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
/* per-set logging */
.setlog { display: flex; flex-direction: column; gap: 8px; }
.setrow { display: grid; grid-template-columns: 22px minmax(0, 1.4fr) 14px minmax(0, 1fr) 48px; gap: 6px; align-items: center; }
.setrow .ix { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; }
.setrow input { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 8px; width: 100%; min-width: 0; font-size: 16px; font-variant-numeric: tabular-nums; }
.setrow .x { text-align: center; color: var(--muted); }
.setrow .chk { height: 44px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; }
.setrow.done .chk { background: var(--ok); border-color: var(--ok); color: #fff; }
.setrow.done input { border-color: var(--ok); }
.stepper { display: inline-flex; align-items: center; gap: 0; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.stepper button { border: 0; background: transparent; width: 40px; height: 36px; font-size: 1.1rem; font-weight: 700; }
.stepper span { min-width: 70px; text-align: center; font-weight: 600; font-size: .9rem; font-variant-numeric: tabular-nums; }
/* PR tables */
.prt { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: .92rem; }
.prt th { text-align: left; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 0 6px 6px 0; }
.prt td { padding: 8px 6px 8px 0; border-top: 1px solid var(--line); }
.prt td.w { color: var(--max); font-weight: 700; }
.prt td.d { color: var(--muted); font-size: .82rem; }
.prt button { border: 0; background: transparent; color: var(--muted); font-size: 1rem; padding: 2px 6px; }
.libitem { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 14px; text-align: left; width: 100%; align-items: center; }
.libitem b { min-width: 0; }
.libitem small { color: var(--muted); font-size: .8rem; min-width: 0; }
.libitem .mx { color: var(--max); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: .9rem; text-align: right; }
.prbadge { display: inline-block; font-size: .66rem; font-weight: 800; letter-spacing: .06em; padding: 1px 6px; border-radius: 6px; background: var(--max); color: #fff; vertical-align: 1px; }
.hist-entry ul { list-style: none; padding: 0; margin: 6px 0 0; display: flex; flex-direction: column; gap: 4px; font-size: .86rem; color: var(--fg); }
.hist-entry li span { color: var(--muted); }
.setrow.tm { grid-template-columns: 22px minmax(0, 1.2fr) minmax(0, 1fr) 44px 48px; }
.setrow.tm.now { grid-template-columns: 22px minmax(0, 1fr) 44px 48px; }
.setrow .swt { height: 44px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-size: .9rem; }
.setrow .swt.run { background: var(--max); border-color: var(--max); color: #fff; }
.swipe { position: relative; border-radius: var(--r); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.swipe.lifted { z-index: 50; pointer-events: none; transition: none; opacity: .88; }
.swipe.lifted > .ex { box-shadow: 0 14px 34px rgba(0, 0, 0, .28); border-color: var(--dc); }
body.dnd, body.dnd * { -webkit-user-select: none; user-select: none; cursor: grabbing; }
.swipe.drop-ss > .ex { outline: 2.5px dashed var(--dc); outline-offset: 2px; }
.swipe.drop-ss::after { content: "Superset"; position: absolute; right: 12px; top: -11px; z-index: 3; background: var(--dc); color: #fff; font-size: .7rem; font-weight: 700; letter-spacing: .04em; padding: 2px 9px; border-radius: 999px; }
.swipe.drop-before::before, .swipe.drop-after::before { content: ""; position: absolute; left: 6px; right: 6px; height: 4px; border-radius: 2px; background: var(--dc); z-index: 3; }
.swipe.drop-before::before { top: -6px; }
.swipe.drop-after::before { bottom: -6px; }
.swipe-bg { position: absolute; inset: 0; border-radius: var(--r); background: var(--max); color: #fff; display: flex; align-items: center; padding-left: 18px; font-weight: 700; opacity: 0; pointer-events: none; }
.swipe > .ex { position: relative; touch-action: pan-y; transition: transform .18s ease, border-color .15s; }

}

const dayById = id => S.days.find(d => d.id === id);
function findEx(day, exId) {
  for (const sec of day.sections) { const i = sec.items.findIndex(e => e.id === exId); if (i >= 0) return { sec, i, ex: sec.items[i] }; }
  return null;
}
const cur = ex => ex.variants[Math.min(ex.cur || 0, ex.variants.length - 1)];
const allEx = day => day.sections.flatMap(s => s.items);
function runOf(sec, i) { // the contiguous superset block containing item i
  const g = sec.items[i].group; if (!g) return [sec.items[i]];
  let a = i, b = i;
  while (a > 0 && sec.items[a - 1].group === g) a--;
  while (b < sec.items.length - 1 && sec.items[b + 1].group === g) b++;
  return sec.items.slice(a, b + 1);
}
function blocks(day) { // list of runs across the day, in order
  const out = [];
  for (const sec of day.sections) { let i = 0; while (i < sec.items.length) { const r = runOf(sec, i); out.push({ sec, items: r }); i += r.length; } }
  return out;
}
function cleanGroups(sec) {
  const counts = {};
  sec.items.forEach((e, i) => { if (e.group) { const r = runOf(sec, i); counts[e.id] = r.length; } });
  sec.items.forEach(e => { if (e.group && counts[e.id] < 2) e.group = null; });
}

}

}
/* time-based exercises */
function parseDur(x) {

}

}
const fmtClock = sec => sec == null || sec === "" || isNaN(sec) ? "" : `${Math.floor(sec / 60)}:${pad2(Math.round(sec) % 60)}`;
const isTime = v => v.mode === "time";
function targetTime(v) {

}
const safeUrl = u => /^https:\/\//i.test(String(u || "").trim()) ? String(u).trim() : "";
const videoFor = v => safeUrl(v.video) || "https://www.youtube.com/results?search_query=" + encodeURIComponent(`how to ${v.name} exercise proper form`);

function getSets(exId) { return (S.active && S.active.sets && S.active.sets[exId]) || []; }
function setsDone(exId) { return getSets(exId).filter(s => s && s.done).length; }
function setDefault(v, arr, i) {

/* ---------- exercise database ---------- */
function norm(s) { return String(s || "").trim().toLowerCase(); }
function libByName(name) { return S.lib.find(l => norm(l.name) === norm(name)); }
function ensureLib(name) {
  name = String(name || "").trim(); if (!name) return null;
  let l = libByName(name);
  if (!l) { l = { id: uid(), name, prs: [] }; S.lib.push(l); }
  return l;
}
const prKind = p => p.t != null && p.t !== "" ? "t" : "r";
function prKey(p) {
  const pw = parseW(p.w);
  if (prKind(p) === "t") return "t|" + (loadText(p.w) || "-");
  return pw ? `${pw.bw ? "bw" : "kg"}|${String(p.r ?? "").trim()}` : null;
}
const prVal = p => prKind(p) === "t" ? +p.t : parseW(p.w).kg;
function validPR(p) { return prKind(p) === "t" ? +p.t > 0 : !!(parseW(p.w) && isNumR(p.r)); }
function bestFor(l, p) {
  const k = prKey(p); if (!k || !l) return null;
  return l.prs.filter(x => prKey(x) === k).sort((a, b) => prVal(b) - prVal(a))[0] || null;
}
function beats(l, p) {
  if (!l || !validPR(p)) return false;
  const b = bestFor(l, p);
  return !b || prVal(p) > prVal(b);
}
function addPR(name, p, date) {
  const l = ensureLib(name); if (!l || !beats(l, p)) return false;
  const e = { id: uid(), w: String(p.w ?? "").trim(), date: date || today() };
  if (prKind(p) === "t") e.t = +p.t; else e.r = String(p.r).trim();
  l.prs.push(e);
  return true;
}
function prTable(l) { // best entry per rep count (and per load for timed holds)
  const best = {};
  l.prs.forEach(p => { const k = prKey(p); if (!k) return; if (!best[k] || prVal(p) > prVal(best[k])) best[k] = p; });
  const vals = Object.values(best);
  const reps = vals.filter(p => prKind(p) === "r").sort((a, b) => (parseInt(a.r) || 999) - (parseInt(b.r) || 999) || String(a.r).localeCompare(String(b.r)) || (parseW(a.w).bw - parseW(b.w).bw));
  const times = vals.filter(p => prKind(p) === "t").sort((a, b) => (parseW(a.w)?.kg || 0) - (parseW(b.w)?.kg || 0));
  return reps.concat(times);
}
function libSummary(l) {
  const t = prTable(l); if (!t.length) return "";
  const withE = t.filter(p => prKind(p) === "r" && e1rm(p.w, p.r)), times = t.filter(p => prKind(p) === "t");
  const top = withE.length ? withE.sort((a, b) => e1rm(b.w, b.r) - e1rm(a.w, a.r))[0] : times.length ? times.sort((a, b) => b.t - a.t)[0] : t.sort((a, b) => b.date.localeCompare(a.date))[0];
  return setText(top);
}
function usedIn(name) {
  const out = [];
  S.days.forEach(d => d.sections.forEach(s => s.items.forEach(e => e.variants.forEach(v => { if (norm(v.name) === norm(name)) out.push({ day: d, ex: e }); }))));
  return out;
}
function applyBW(st) {
  const BW_DEFAULT = ["push-up", "glute bridge", "bodyweight squat", "dead bug", "shoulder taps", "hanging knee raise", "one-arm push-up", "muscle-up", "trx row", "handstands", "copenhagen plank", "wall sit", "skater squat", "box jump", "depth jump + stick", "single leg bound", "180-360-540 jumps", "hanging", "monkey bars"];
  st.days.forEach(d => d.sections.forEach(s => s.items.forEach(e => e.variants.forEach(v => { if (!String(v.weight || "").trim() && BW_DEFAULT.includes(norm(v.name))) v.weight = "BW"; }))));

}
function migrate(st) {

    st.days.forEach(d => d.sections.forEach(s => s.items.forEach(e => e.variants.forEach(v => {

    }))));

  st.days.forEach(d => d.sections.forEach(sc => sc.items.forEach(e => e.variants.forEach(v => { if (v.count) syncSetsText(v); }))));
  st.days.forEach(d => d.sections.forEach(sc => sc.items.forEach(e => e.variants.forEach(v => {

  }))));

}
function wInput(id, value, label = "Weight") {

/* ---------- week logic ---------- */
function weekEntries(ws) { const a = dkey(ws), b = dkey(addDays(ws, 7)); return S.log.filter(e => e.date >= a && e.date < b); }
function strengthDays() { return S.days.filter(d => d.kind === "strength"); }
function nextUp() {
  const ws = weekStart(new Date());
  const done = new Set(weekEntries(ws).map(e => e.dayId));
  const strength = (S.cycle || []).map(dayById).filter(Boolean).length ? S.cycle.map(dayById).filter(Boolean) : strengthDays();
  const last = [...S.log].filter(e => strength.some(d => d.id === e.dayId)).sort((a, b) => (a.date + (a.at || "")).localeCompare(b.date + (b.at || ""))).pop();
  let start = last ? (strength.findIndex(d => d.id === last.dayId) + 1) % strength.length : 0;

}

let editMode = false, exEdit = null, calMonth = null, calSel = today(), toastTimer = null;
function route() {

  if (h.startsWith("ex-")) { const [, d, e] = h.split("-"); return { name: "ex", day: d, ex: e }; }

function toast(msg, actionLabel, action) {

  if (actionLabel) { const b = document.createElement("button"); b.textContent = actionLabel; b.onclick = ev => { ev.stopPropagation(); el.remove(); action(); }; el.appendChild(b); }

function ask(msg, okLabel, fn, danger = true) {

function startDay(day, date) {

}
function logEntry(dayId, date, items) {
  S.log.push({ id: uid(), date, dayId, at: new Date().toISOString(), items: items || [] });
}
function topSet(v, done) { // heaviest set, then most reps (timed: heaviest load, then longest time)

  if (!cand.length) return null;
  const kg = x => parseW(x.w)?.kg ?? -Infinity;
  return cand.sort((a, b) => kg(b) - kg(a) || (isTime(v) ? b.t - a.t : (parseFloat(b.r) || 0) - (parseFloat(a.r) || 0)))[0];
}
function prToast(day, exId, st) {
  if (!st) return; const v = cur(findEx(day, exId).ex);
  const x = isTime(v) ? { w: st.w || "", t: st.t } : { w: st.w, r: st.r };
  if (beats(libByName(v.name), x)) toast(`New PR: ${setText(x)} 🏆`);
}
function finishDay(day) {
  if (swRun) stopSw(true);
  const date = S.active.date || today();
  let prCount = 0;
  const items = allEx(day).filter(e => setsDone(e.id) > 0).map(e => {
    const v = cur(e), sets = getSets(e.id).filter(x => x && x.done).map(x => isTime(v) ? { w: x.w || "", t: x.t } : { w: x.w, r: x.r });
    const prs = [];
    // best set per rep count (or per load for timed sets) goes to the exercise database if it beats the record
    const best = {};
    sets.forEach(x => { if (!validPR(x)) return; const k = prKey(x); if (!best[k] || prVal(x) > prVal(best[k])) best[k] = x; });
    Object.values(best).forEach(x => { if (addPR(v.name, x, date)) prs.push(setText(x)); });
    // working max follows what you actually lifted
    const tp = topSet(v, sets);
    if (tp) {
      const nw = String(tp.w || ""), nr = isTime(v) ? fmtDur(tp.t) : String(tp.r);
      if (nw !== String(v.weight || "") || nr !== String(v.reps || "")) {
        if (v.weight || v.reps) (v.history = v.history || []).push({ weight: v.weight, reps: v.reps, date: v.maxDate || date });
        v.weight = nw; v.reps = nr;

      v.maxDate = date; v.maxFrom = day.name;

    return { name: v.name, label: e.label || "", sets, prs };
  });

  S.active = null; save(); calSel = date; calMonth = null;
  toast(prCount ? `${day.name} logged · ${prCount} new PR${prCount === 1 ? "" : "s"} 🏆` : `${day.name} logged`); go("calendar");
}
function moveEx(day, exId, dir) {
  const f = findEx(day, exId); if (!f) return;

  f.sec.items.splice(f.i, 1);

/* ---------- touch gestures on exercise cards ----------
   swipe right = delete · hold ~0.4 s then drag = superset (drop on a card) or move (drop on its edge) · vertical = scroll */
let G = null, swipedAt = 0;
const HOLD_MS = 380;
const clearDrop = keep => document.querySelectorAll(".drop-ss, .drop-before, .drop-after").forEach(x => { if (x !== keep) x.classList.remove("drop-ss", "drop-before", "drop-after"); });
document.addEventListener("pointerdown", e => {
  const w = e.target.closest && e.target.closest(".swipe"); if (!w || e.button) return;
  if (G) clearTimeout(G.timer);
  G = { w, el: w.querySelector(".ex"), bg: w.querySelector(".swipe-bg"), id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, sy0: window.scrollY, mode: "wait", dx: 0, vx: 0, lt: performance.now(), lx: e.clientX };
  G.timer = setTimeout(() => { if (G && G.mode === "wait") startDnd(); }, HOLD_MS);
});
function startDnd() {
  G.mode = "drag"; swipedAt = Date.now() + 1e6; // no tap while holding
  try { navigator.vibrate && navigator.vibrate(12); } catch {}
  document.body.classList.add("dnd"); G.w.classList.add("lifted");
  G.w.style.transform = "scale(1.03)";
  G.raf = requestAnimationFrame(dndFrame);
}
document.addEventListener("pointermove", e => {
  if (!G || e.pointerId !== G.id) return;
  const now = performance.now();
  G.vx = (e.clientX - G.lx) / Math.max(1, now - G.lt); G.lx = e.clientX; G.lt = now;
  G.x = e.clientX; G.y = e.clientY;
  const dx = e.clientX - G.x0, dy = e.clientY - G.y0;
  if (G.mode === "wait") {
    if (dx > 6 && dx > Math.abs(dy) * 1.2) { clearTimeout(G.timer); G.mode = "swipe"; G.w.classList.add("dragging"); swipedAt = Date.now() + 1e6; }
    else if (Math.hypot(dx, dy) > 8) { clearTimeout(G.timer); G = null; return; } // a scroll or a left swipe: let the page have it
    else return;
  }
  if (G.mode === "swipe") {
    G.dx = Math.max(0, dx);
    G.el.style.transform = `translateX(${G.dx}px)`;
    G.bg.style.opacity = Math.min(1, G.dx / 70);
  }
});
// keep the page still while swiping or dragging a card
document.addEventListener("touchmove", e => { if (G && (G.mode === "drag" || G.mode === "swipe")) e.preventDefault(); }, { passive: false });
document.addEventListener("contextmenu", e => { if (e.target.closest && e.target.closest(".swipe")) e.preventDefault(); });
function dndFrame() {
  if (!G || G.mode !== "drag") return;
  const H = window.innerHeight;
  if (G.y < 90) window.scrollBy(0, -Math.ceil((90 - G.y) / 5));
  else if (G.y > H - 120) window.scrollBy(0, Math.ceil((G.y - (H - 120)) / 5));
  const ty = G.y - G.y0 + (window.scrollY - G.sy0), tx = (G.x - G.x0) * 0.25;
  G.w.style.transform = `translate(${tx}px, ${ty}px) scale(1.03)`;
  const under = document.elementFromPoint(G.x, G.y), tgt = under && under.closest ? under.closest(".swipe") : null;
  G.drop = null;
  if (tgt && tgt !== G.w) {
    const r = tgt.getBoundingClientRect(), f = (G.y - r.top) / r.height;
    const pos = f < 0.25 ? "before" : f > 0.75 ? "after" : "ss";
    clearDrop(tgt); tgt.classList.remove("drop-ss", "drop-before", "drop-after"); tgt.classList.add("drop-" + pos);

}
function gEnd(e) {
  if (!G || (e && e.pointerId !== G.id)) return;
  const g = G; G = null; clearTimeout(g.timer);
  if (g.mode === "wait") return; // plain tap: the click opens the exercise
  swipedAt = Date.now();
  if (g.mode === "swipe") {
    g.w.classList.remove("dragging");
    const W = g.w.offsetWidth;
    if (e.type !== "pointercancel" && (g.dx > W * 0.33 || (g.vx > 0.45 && g.dx > 40))) {
      g.el.style.transform = `translateX(${W}px)`; g.bg.style.opacity = 1;
      setTimeout(() => deleteEx(g.w.dataset.swipe), 150);
    } else { g.el.style.transform = ""; g.bg.style.opacity = 0; }
    return;
  }
  cancelAnimationFrame(g.raf); document.body.classList.remove("dnd"); clearDrop(null);
  g.w.classList.remove("lifted"); g.w.style.transform = "";
  if (g.drop && e.type !== "pointercancel") dropEx(g.w.dataset.swipe, g.drop);
}
document.addEventListener("pointerup", gEnd);
document.addEventListener("pointercancel", gEnd);
function dropEx(dragId, drop) {
  const day = dayById(route().day); if (!day || dragId === drop.id) return;
  const snap = JSON.stringify(day.sections);
  const a = findEx(day, dragId); if (!a) return;
  const ex = a.ex; a.sec.items.splice(a.i, 1);
  const b = findEx(day, drop.id); if (!b) { day.sections = JSON.parse(snap); return; }
  let msg;
  if (drop.pos === "ss") {
    b.sec.items.splice(b.i + 1, 0, ex);
    const g = b.ex.group || "g" + uid(); b.ex.group = g; ex.group = g;
    msg = `Superset: ${cur(b.ex).name} + ${cur(ex).name}`;
  } else {
    const at = drop.pos === "before" ? b.i : b.i + 1;
    b.sec.items.splice(at, 0, ex);
    const prev = b.sec.items[at - 1], next = b.sec.items[at + 1];
    ex.group = prev && next && prev.group && prev.group === next.group ? prev.group : null;
    msg = `Moved ${cur(ex).name}`;
  }
  day.sections.forEach(cleanGroups); save(); render();
  try { navigator.vibrate && navigator.vibrate(10); } catch {}
  toast(msg, "Undo", () => { day.sections = JSON.parse(snap); save(); render(); });
}

function updSet(exId, i) { // read a set row's inputs into the session
  if (!S.active) return [];
  S.active.sets = S.active.sets || {};

  if (tEl && !(swRun && swRun.exId === exId && swRun.i === i)) arr[i].t = parseDur(tEl.value);
  arr[i].touched = true;
  // later sets you haven't touched follow this one
  for (let j = i + 1; j < arr.length; j++) {
