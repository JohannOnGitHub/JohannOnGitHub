<title>AW/26 Training</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column, a sticky top bar, a bottom tab bar; days are colour-coded like gym plates. */
:root {
  --bg: #eef0f3;
  --surface: #ffffff;
  --surface-2: #f5f6f8;
  --line: #d9dde3;
  --fg: #16181d;
  --muted: #5d6470;
  --accent: #1f2430;
  --on-accent: #ffffff;
  --max: #d22f27;          /* her "max set" red */
  --max-soft: #fbe7e5;
  --ok: #1f8a55;
  --c-ua: #5b3fa6;
  --c-ub: #2f6fd0;
  --c-la: #0d8a6a;
  --c-lb: #b5651d;
  --c-sport: #c23b5e;
  --shadow: 0 1px 2px rgba(20, 24, 32, .06), 0 4px 14px rgba(20, 24, 32, .05);
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111318; --surface: #1a1d24; --surface-2: #22262f; --line: #2f3440;
    --fg: #eef0f4; --muted: #9aa2b1; --accent: #eef0f4; --on-accent: #111318;
    --max: #ff6a5f; --max-soft: #3a1d1b; --ok: #4cc488;
    --c-ua: #a68bf0; --c-ub: #6fa3ff; --c-la: #3fc79f; --c-lb: #f09a4f; --c-sport: #ff7f9f;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111318; --surface: #1a1d24; --surface-2: #22262f; --line: #2f3440;
  --fg: #eef0f4; --muted: #9aa2b1; --accent: #eef0f4; --on-accent: #111318;
  --max: #ff6a5f; --max-soft: #3a1d1b; --ok: #4cc488;
  --c-ua: #a68bf0; --c-ub: #6fa3ff; --c-la: #3fc79f; --c-lb: #f09a4f; --c-sport: #ff7f9f;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--c-ua); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; line-height: 1.05; }
h1 { font-size: 2.4rem; text-transform: uppercase; }
h2 { font-size: 1.5rem; text-transform: uppercase; }
h3 { font-size: 1.2rem; }
.label { font-size: .72rem; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.red { color: var(--max); }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 10px; display: flex; align-items: center; gap: 10px; min-height: 52px; }
.top .title { flex: 1; min-width: 0; font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; height: 38px; min-width: 38px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; font-size: .88rem; }
.iconbtn.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

/* buttons */
.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 600; background: var(--accent); color: var(--on-accent); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.ghost { background: var(--surface); color: var(--fg); border: 1px solid var(--line); }
.btn.danger { background: transparent; color: var(--max); border: 1px solid var(--max); }
.btn.small { padding: 8px 12px; font-size: .88rem; border-radius: 10px; }
.btn.block { width: 100%; }
.btn.daycol { background: var(--dc); color: #fff; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > .grow { flex: 1; min-width: 0; }

/* hero */
.hero { display: flex; flex-direction: column; gap: 8px; padding-top: 6px; }
.hero h1 span { color: var(--c-ua); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: .78rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.pad { padding: 16px; }

/* week strip */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0 10px; border-radius: 10px; }
.wd .d { font-size: .7rem; font-weight: 600; color: var(--muted); text-transform: uppercase; }
.wd .n { font-weight: 600; font-variant-numeric: tabular-nums; }
.wd.today { background: var(--surface-2); outline: 1.5px solid var(--fg); }
.dots { display: flex; gap: 3px; min-height: 16px; flex-wrap: wrap; justify-content: center; }
.pip { min-width: 16px; padding: 0 2px; height: 16px; border-radius: 4px; background: var(--dc); color: #fff; font-size: .6rem; font-weight: 700; display: grid; place-items: center; line-height: 1; }

.three { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 8px; }
.guide summary { cursor: pointer; font-weight: 600; }
.guide dl { margin: 10px 0 0; display: grid; gap: 8px; font-size: .9rem; }
.guide dt { font-weight: 600; }
.guide dd { margin: 0; color: var(--muted); }
.cat { color: var(--dc); }
.tri { border-radius: 10px; padding: 8px 10px; border: 1.5px dashed var(--line); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tri.done { border: 1.5px solid var(--dc); background: color-mix(in srgb, var(--dc) 12%, transparent); }
.tri b { font-size: .86rem; }
.tri small { font-size: .74rem; color: var(--muted); }

.next { border-radius: var(--r); padding: 18px; background: var(--dc); color: #fff; display: flex; flex-direction: column; gap: 10px; }
.next .label { color: rgba(255,255,255,.85); }
.next h2 { font-size: 2rem; }
.next .btn { background: #fff; color: #16181d; align-self: flex-start; }

/* day cards */
.days { display: grid; gap: 10px; }
.day { display: grid; grid-template-columns: 8px 1fr auto; gap: 14px; align-items: center; text-align: left; padding: 14px 16px 14px 0; width: 100%; overflow: hidden; }
.day .stripe { align-self: stretch; background: var(--dc); border-radius: 0 4px 4px 0; }
.day .meta { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.day .meta p { margin: 0; font-size: .86rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.chev { color: var(--muted); font-size: 1.3rem; }
.badge { font-size: .7rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.badge.live { background: var(--ok); color: #fff; }

/* day screen */
.dayhead { border-radius: var(--r); padding: 18px; background: var(--dc); color: #fff; display: flex; flex-direction: column; gap: 12px; }
.dayhead p { margin: 0; opacity: .92; }
.dayhead .btn { background: #fff; color: #16181d; }
.dayhead .btn.ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.6); }
.progress { height: 6px; border-radius: 3px; background: rgba(255,255,255,.3); overflow: hidden; }
.progress i { display: block; height: 100%; background: #fff; }
.section { display: flex; flex-direction: column; gap: 8px; }
.section > .label { padding-left: 2px; }
.list { display: flex; flex-direction: column; gap: 8px; }
.ex { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 13px 14px; text-align: left; width: 100%; align-items: center; }
.ex .nm { font-weight: 600; min-width: 0; }
.ex .sub { font-size: .84rem; color: var(--muted); min-width: 0; }
.ex .mx { text-align: right; font-weight: 700; color: var(--max); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: .92rem; }
.ex .mx.none { color: var(--muted); font-weight: 500; font-size: .8rem; }
.ex.complete { border-color: var(--ok); }
.ex.complete .nm::before { content: "✓ "; color: var(--ok); }
.setbar { grid-column: 1 / -1; display: flex; gap: 4px; margin-top: 4px; }
.setbar i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); max-width: 40px; }
.setbar i.on { background: var(--ok); }
.ss { border-left: 4px solid var(--dc); border-radius: var(--r); padding-left: 8px; display: flex; flex-direction: column; gap: 6px; }
.ss .label { color: var(--dc); }
.editrow { display: flex; gap: 6px; align-items: stretch; }
.editrow .ex { flex: 1; min-width: 0; }
.mv { display: flex; flex-direction: column; gap: 4px; }
.mv button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 38px; flex: 1; font-size: .9rem; }
.mv button:disabled { opacity: .35; }
.linker { align-self: center; border: 1px dashed var(--line); background: transparent; border-radius: 999px; padding: 3px 12px; font-size: .76rem; font-weight: 600; color: var(--muted); }
.linker.on { border-style: solid; border-color: var(--dc); color: var(--dc); }
.add { border: 1.5px dashed var(--line); background: transparent; border-radius: var(--r); padding: 12px; font-weight: 600; color: var(--muted); }

/* exercise screen */
.panel { display: flex; flex-direction: column; gap: 14px; padding: 16px; }
.panel h2 { font-size: 1.8rem; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-size: .84rem; font-weight: 600; }
.chip.on { background: var(--dc); border-color: var(--dc); color: #fff; }
.presc { display: flex; gap: 10px; flex-wrap: wrap; }
.presc .big { font-family: var(--font-display); font-size: 1.7rem; font-weight: 700; line-height: 1; }
.notes { margin: 0; padding: 10px 12px; background: var(--surface-2); border-radius: 10px; font-size: .92rem; }
.maxbox { border-radius: 12px; padding: 14px; background: var(--max-soft); border: 1.5px solid var(--max); display: flex; flex-direction: column; gap: 10px; }
.maxbox .val { font-family: var(--font-display); font-size: 2.2rem; font-weight: 700; color: var(--max); line-height: 1; font-variant-numeric: tabular-nums; }
.maxbox .label { color: var(--max); }
.hist { font-size: .82rem; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
.field label { font-size: .76rem; font-weight: 600; color: var(--muted); }
.field input, .field textarea, .field select { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; font-size: 16px; }
.field textarea { min-height: 70px; resize: vertical; }
.sets { display: flex; gap: 8px; flex-wrap: wrap; }
.set { width: 52px; height: 52px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-variant-numeric: tabular-nums; display: grid; place-items: center; }
.set.on { background: var(--ok); border-color: var(--ok); color: #fff; }
.sstip { padding: 10px 14px; border-radius: 12px; background: color-mix(in srgb, var(--dc) 14%, transparent); border: 1px solid var(--dc); font-size: .9rem; }
.pager { display: flex; gap: 10px; }
.pager .btn { flex: 1; min-width: 0; }
.pager .btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* rest timer */
.timer { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.timer .t { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; min-width: 64px; font-variant-numeric: tabular-nums; }
.timer .t.done { color: var(--ok); }

/* calendar */
.calnav { display: flex; align-items: center; gap: 8px; }
.calnav h2 { flex: 1; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .h { text-align: center; font-size: .7rem; font-weight: 600; color: var(--muted); text-transform: uppercase; padding-bottom: 2px; }
.cell { aspect-ratio: 1 / 1.15; max-width: 100%; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 3px; padding: 5px 2px; min-width: 0; }
.cell.out { opacity: .35; }
.cell.today { outline: 2px solid var(--fg); outline-offset: -1px; }
.cell.sel { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.cell .n { font-size: .82rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: .8rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.entry { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; }
.entry .grow { flex: 1; min-width: 0; }
.entry ul { margin: 4px 0 0; padding-left: 18px; font-size: .86rem; color: var(--muted); }
.weekrow { display: grid; grid-template-columns: 92px 1fr; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: .86rem; }
.weekrow:first-of-type { border-top: 0; }

/* bottom nav */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabs button { border: 0; background: transparent; padding: 10px 0 12px; font-size: .74rem; font-weight: 600; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button.on { color: var(--fg); }

/* sheet */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(10,12,16,.5); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; border-radius: 18px 18px 0 0; padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 45; background: var(--accent); color: var(--on-accent); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: .9rem; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
/* weight input with BW toggle */
.wt { display: flex; align-items: stretch; min-width: 0; }
.wt input { border-top-left-radius: 0 !important; border-bottom-left-radius: 0 !important; }
.bw { border: 1px solid var(--line); border-right: 0; background: var(--surface-2); border-radius: 10px 0 0 10px; padding: 0 10px; font-size: .78rem; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.bw.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
/* per-set logging */
.setlog { display: flex; flex-direction: column; gap: 8px; }
.setrow { display: grid; grid-template-columns: 22px minmax(0, 1.4fr) 14px minmax(0, 1fr) 48px; gap: 6px; align-items: center; }
.setrow .ix { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; }
.setrow input { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 8px; width: 100%; min-width: 0; font-size: 16px; font-variant-numeric: tabular-nums; }
.setrow .x { text-align: center; color: var(--muted); }
.setrow .chk { height: 44px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; }
.setrow.done .chk { background: var(--ok); border-color: var(--ok); color: #fff; }
.setrow.done input { border-color: var(--ok); }
.stepper { display: inline-flex; align-items: center; gap: 0; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.stepper button { border: 0; background: transparent; width: 40px; height: 36px; font-size: 1.1rem; font-weight: 700; }
.stepper span { min-width: 70px; text-align: center; font-weight: 600; font-size: .9rem; font-variant-numeric: tabular-nums; }
/* PR tables */
.prt { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: .92rem; }
.prt th { text-align: left; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 0 6px 6px 0; }
.prt td { padding: 8px 6px 8px 0; border-top: 1px solid var(--line); }
.prt td.w { color: var(--max); font-weight: 700; }
.prt td.d { color: var(--muted); font-size: .82rem; }
.prt button { border: 0; background: transparent; color: var(--muted); font-size: 1rem; padding: 2px 6px; }
.libitem { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 14px; text-align: left; width: 100%; align-items: center; }
.libitem b { min-width: 0; }
.libitem small { color: var(--muted); font-size: .8rem; min-width: 0; }
.libitem .mx { color: var(--max); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: .9rem; text-align: right; }
.prbadge { display: inline-block; font-size: .66rem; font-weight: 800; letter-spacing: .06em; padding: 1px 6px; border-radius: 6px; background: var(--max); color: #fff; vertical-align: 1px; }
.hist-entry ul { list-style: none; padding: 0; margin: 6px 0 0; display: flex; flex-direction: column; gap: 4px; font-size: .86rem; color: var(--fg); }
.hist-entry li span { color: var(--muted); }
textarea.code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; min-height: 120px; }
@media (prefers-reduced-motion: no-preference) { .btn, .chip, .set, .ex { transition: background-color .15s, border-color .15s, transform .1s; } .set:active, .btn:active { transform: scale(.97); } }
</style>

<script>
(() => {
"use strict";
const KEY = "aw26.v1";
const DAYS_META = [
  { id: "upperA", color: "var(--c-ua)", letter: "UA" },
  { id: "upperB", color: "var(--c-ub)", letter: "UB" },
  { id: "lowerA", color: "var(--c-la)", letter: "LA" },
  { id: "lowerB", color: "var(--c-lb)", letter: "LB" },
  { id: "sport", color: "var(--c-sport)", letter: "S" },
];
const META = Object.fromEntries(DAYS_META.map(d => [d.id, d]));

/* ---------- helpers ---------- */
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad2 = n => String(n).padStart(2, "0");
const dkey = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => dkey(new Date());
const weekStart = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fmtDate = (k, opts = { weekday: "short", day: "numeric", month: "short" }) => parseKey(k).toLocaleDateString("en-GB", opts);
const guessCount = s => { const m = String(s || "").match(/^\s*(\d+)\s*[×xX]/); if (m) return Math.min(12, +m[1]); const list = String(s || "").match(/^\s*\d+(\s*,\s*\d+)+/); return list ? list[0].split(",").length : 1; };
const num = v => { const s = String(v ?? "").trim().replace(",", "."); return s === "" ? "" : s; };
/* ---------- seed: the programme from the Google Doc ---------- */
function V(name, sets, o = {}) {
  return { id: uid(), name, sets, count: o.c ?? guessCount(sets), notes: o.n || "", weight: o.w ?? "", reps: o.r ?? "", maxDate: (o.w || o.r) ? today() : "", history: [] };
}
function E(...variants) { return { id: uid(), cur: 0, group: null, variants }; }
function S_(title, items) { return { id: uid(), title, items }; }
function L(label, ...variants) { const e = E(...variants); e.label = label; return e; }
function seed() {

  return null;
}
const cur = ex => ex.variants[Math.min(ex.cur || 0, ex.variants.length - 1)];
const allEx = day => day.sections.flatMap(s => s.items);
function runOf(sec, i) { // the contiguous superset block containing item i

}

}

function parseW(w) {

}
function fmtW(w) {

}

}
const setText = s => maxText({ weight: s.w, reps: s.r });

function getSets(exId) { return (S.active && S.active.sets && S.active.sets[exId]) || []; }

function setDefault(v, arr, i) {

/* ---------- exercise database ---------- */
function norm(s) { return String(s || "").trim().toLowerCase(); }
function libByName(name) { return S.lib.find(l => norm(l.name) === norm(name)); }
function ensureLib(name) {

  let l = libByName(name);
  if (!l) { l = { id: uid(), name, prs: [] }; S.lib.push(l); }
  return l;
}
const prKey = (w, r) => { const p = parseW(w); return p ? `${p.bw ? "bw" : "kg"}|${String(r).trim()}` : null; };
function bestFor(l, w, r) {

}

}
function addPR(name, w, r, date) {

  l.prs.push({ id: uid(), w: String(w).trim(), r: String(r).trim(), date: date || today() });
  return true;
}

  const best = {};

      <div class="tags">${S.tags.slice(1).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
    </header>
    ${nextCard}
    <section class="card pad" style="display:flex;flex-direction:column;gap:12px">
      <div class="row"><h3 class="grow">This week</h3><span class="label num">${doneCount}/${strengthDays().length} strength</span></div>
      ${weekStrip()}
      ${threeStatus(ws)}
      <button class="btn ghost small" data-go="calendar">Open calendar</button>
    </section>
    <section class="section">
      <span class="label">The programme · choose today's workout</span>
      <div class="days">${S.days.map(d => {
        const names = allEx(d).filter((_, i, a) => true).map(e => cur(e).name);
        const main = d.sections.find(s => !/warm|stretch/i.test(s.title)) || d.sections[0];
        const live = S.active && S.active.dayId === d.id;
        return `<button class="card day" style="--dc:${META[d.id].color}" data-go="day-${d.id}"><span class="stripe"></span>
          <span class="meta"><span class="row" style="gap:8px"><h3>${esc(d.name)}</h3>${live ? '<span class="badge live">In progress</span>' : d.kind === "strength" ? '<span class="badge">Strength</span>' : ""}</span>
          <p>${esc(main.items.map(e => cur(e).name).join(" · "))}</p>
          <span class="label">${names.length} exercise${names.length === 1 ? "" : "s"}</span></span><span class="chev">›</span></button>`;
      }).join("")}</div>
    </section>
  </div>${tabs("home")}`;
}

function exRow(day, ex) {
  const v = cur(ex), mt = maxText(v), done = setsDone(ex.id), count = v.count || 1;
  const bars = S.active && S.active.dayId === day.id ? `<span class="setbar">${Array.from({ length: count }, (_, i) => `<i class="${i < done ? "on" : ""}"></i>`).join("")}</span>` : "";
  const alts = ex.variants.length > 1 ? ` · ${ex.variants.length - 1} alternative${ex.variants.length > 2 ? "s" : ""}` : "";
  return `<button style="--dc:${META[day.id].color}" class="card ex ${S.active && S.active.dayId === day.id && done >= count ? "complete" : ""}" data-go="ex-${day.id}-${ex.id}">
    <span class="nm">${esc(v.name)}</span>
    <span class="mx ${mt ? "" : "none"}">${mt ? esc(mt) : ""}</span>
    <span class="sub">${ex.label ? `<span class="cat">${esc(ex.label)}</span> · ` : ""}${esc(v.sets)}${alts}</span><span></span>${bars}</button>`;
}

function viewDay(r) {
  const day = dayById(r.day); if (!day) return viewHome();
  const color = META[day.id].color;
  const live = S.active && S.active.dayId === day.id;
  let total = 0, done = 0;
  if (live) allEx(day).forEach(e => { const c = cur(e).count || 1; total += c; done += Math.min(c, setsDone(e.id)); });
  const head = `<div class="dayhead" style="--dc:${color}">
    <span class="label" style="color:rgba(255,255,255,.85)">${day.kind === "strength" ? "Strength day" : day.kind === "cardio" ? "Cardio & mobility" : "Session"}</span>
    <h1 style="font-size:2.2rem">${esc(day.name)}</h1><p>${esc(day.focus)}</p>
    ${live ? `<div class="progress"><i style="width:${total ? Math.round(done / total * 100) : 0}%"></i></div><span class="num" style="font-size:.86rem">${done} of ${total} sets done${S.active.date !== today() ? ` · logging for ${esc(fmtDate(S.active.date))}` : ""}</span>
      <div class="row"><button class="btn grow" id="finish">Finish &amp; log workout</button><button class="btn ghost" id="discard">Discard</button></div>`
      : `<div class="row"><button class="btn grow" id="start">Start workout</button><button class="btn ghost" id="quicklog">Log as done</button></div>`}
  </div>`;
  const secs = day.sections.map((sec, si) => {
    let html = `<section class="section"><span class="label">${esc(sec.title)}</span><div class="list">`;
    let i = 0;
    while (i < sec.items.length) {
      const run = runOf(sec, i);
      if (editMode) {
        run.forEach((ex, k) => {
          const idx = i + k, first = si === 0 && idx === 0, last = si === day.sections.length - 1 && idx === sec.items.length - 1;
          html += `<div class="editrow"><div class="mv"><button data-mv="${ex.id}" data-dir="-1" aria-label="Move up" ${first ? "disabled" : ""}>▲</button><button data-mv="${ex.id}" data-dir="1" aria-label="Move down" ${last ? "disabled" : ""}>▼</button></div>${exRow(day, ex)}</div>`;
          if (idx < sec.items.length - 1) {
            const linked = ex.group && sec.items[idx + 1].group === ex.group;
            html += `<button class="linker ${linked ? "on" : ""}" style="--dc:${color}" data-link="${ex.id}">${linked ? "⛓ Superset · tap to split" : "+ Superset with next"}</button>`;
          }
        });
      } else if (run.length > 1) {
        html += `<div class="ss" style="--dc:${color}"><span class="label">Superset · ${run.length} exercises back-to-back</span>${run.map(ex => exRow(day, ex)).join("")}</div>`;
      } else html += exRow(day, run[0]);
      i += run.length;
    }
    if (editMode) html += `<button class="add" data-add="${sec.id}">+ Add exercise to ${esc(sec.title)}</button>`;
    return html + "</div></section>";
  }).join("");
  return `<div class="wrap">
    <div class="top"><button class="iconbtn" data-go="" aria-label="Back">←</button><span class="title">${esc(day.name)}</span>
      <button class="iconbtn ${editMode ? "on" : ""}" id="edit">${editMode ? "Done" : "Edit"}</button></div>
    ${head}
    ${day.guide && day.guide.length ? `<details class="card pad guide"><summary>Ski &amp; sports rules</summary><dl>${day.guide.map(([t, d]) => `<dt>${esc(t)}</dt><dd>${esc(d)}</dd>`).join("")}</dl></details>` : ""}
    ${editMode ? `<p class="notes">Reorder with the arrows. Link two neighbouring exercises to do them as a superset. Tap an exercise and use ⇄ Swap to change it, or Edit to rename it, change sets or add alternatives. New exercises can come from your exercise database.</p>` : ""}
    ${secs}
  </div>${tabs("home")}`;
}

function exPanel(day, ex, inRun) {
  const v = cur(ex), live = S.active && S.active.dayId === day.id, done = setsDone(ex.id), mt = maxText(v);
  const editing = exEdit === ex.id;
  const variantChips = ex.variants.length > 1 || editing ? `<div class="chips" role="group" aria-label="Choose variation">${ex.variants.map((x, i) => `<button class="chip ${i === (ex.cur || 0) ? "on" : ""}" data-var="${ex.id}" data-i="${i}">${esc(x.name)}</button>`).join("")}</div>` : "";
  const hist = (v.history || []).slice(-4).reverse();
  if (editing) {
    return `<article class="card panel" style="--dc:${META[day.id].color}">
      ${variantChips}
      <div class="field"><label for="f-label-${ex.id}">Movement (e.g. Horizontal push)</label><input id="f-label-${ex.id}" value="${esc(ex.label || "")}"></div>
      <div class="field"><label for="f-name-${ex.id}">Exercise name</label><input id="f-name-${ex.id}" value="${esc(v.name)}"></div>
      <div class="row"><div class="field"><label for="f-sets-${ex.id}">Sets × reps</label><input id="f-sets-${ex.id}" value="${esc(v.sets)}" placeholder="3×10"></div>
        <div class="field" style="max-width:110px"><label for="f-count-${ex.id}">Number of sets</label><input id="f-count-${ex.id}" type="number" min="1" max="12" inputmode="numeric" value="${esc(v.count || 1)}"></div></div>
      <div class="field"><label for="f-notes-${ex.id}">Notes and cues</label><textarea id="f-notes-${ex.id}">${esc(v.notes)}</textarea></div>
      <div class="row"><button class="btn grow" data-save="${ex.id}">Save</button><button class="btn ghost" data-cancel="1">Cancel</button></div>
      <div class="row"><button class="btn ghost small" data-addvar="${ex.id}">+ Add alternative exercise</button>
        ${ex.variants.length > 1 ? `<button class="btn danger small" data-delvar="${ex.id}">Remove “${esc(v.name)}”</button>` : ""}
        <button class="btn danger small" data-delex="${ex.id}">Delete exercise</button></div>
    </article>`;
  }
  const lib = libByName(v.name), prs = lib ? prTable(lib).slice(0, 6) : [];
  const rows = live ? liveSets(ex.id, v) : [];
  return `<article class="card panel" style="--dc:${META[day.id].color}">
    <div class="row" style="align-items:flex-start"><div class="grow" style="display:flex;flex-direction:column;gap:4px;min-width:0">${ex.label ? `<span class="label cat">${esc(ex.label)}</span>` : ""}<h2>${esc(v.name)}</h2></div><div class="row" style="gap:6px;flex-wrap:nowrap"><button class="iconbtn" data-swap="${ex.id}">⇄ Swap</button><button class="iconbtn" data-editex="${ex.id}">Edit</button></div></div>
    ${variantChips}
    <div class="presc" style="align-items:center"><span class="big num grow">${esc(v.sets || "—")}</span>
      <span class="stepper" role="group" aria-label="Number of sets"><button data-step="${ex.id}" data-dir="-1" aria-label="One set fewer">−</button><span>${v.count || 1} set${(v.count || 1) === 1 ? "" : "s"}</span><button data-step="${ex.id}" data-dir="1" aria-label="One set more">+</button></span></div>
    ${v.notes ? `<p class="notes">${esc(v.notes)}</p>` : ""}
    ${live ? `<div class="setlog"><span class="label">Log your sets · weight × reps, then ✓</span>
      ${rows.map((st, i) => `<div class="setrow ${st.done ? "done" : ""}"><span class="ix">${i + 1}</span>
        <div class="wt"><button type="button" class="bw ${parseW(st.w)?.bw ? "on" : ""}" data-bwt="sw-${ex.id}-${i}" aria-pressed="${!!parseW(st.w)?.bw}">BW</button><input id="sw-${ex.id}-${i}" data-sx="${ex.id}" data-si="${i}" inputmode="decimal" aria-label="Set ${i + 1} weight" value="${esc(parseW(st.w) ? (parseW(st.w).bw ? (parseW(st.w).kg || "") : parseW(st.w).kg) : st.w)}" placeholder="${parseW(st.w)?.bw ? "+ kg" : "kg"}"></div>
        <span class="x">×</span><input id="sr-${ex.id}-${i}" data-sx="${ex.id}" data-si="${i}" aria-label="Set ${i + 1} reps" value="${esc(st.r)}" placeholder="reps">
        <button class="chk" data-chk="${ex.id}" data-i="${i}" aria-label="Set ${i + 1} done">${st.done ? "✓" : "✓"}</button></div>`).join("")}</div>` : ""}
    <div class="maxbox">
      <span class="label">Working max</span>
      <div class="val">${mt ? esc(mt) : "Not set yet"}</div>
      ${v.maxDate ? `<span class="hist">Since ${esc(fmtDate(v.maxDate, { day: "numeric", month: "short", year: "numeric" }))}</span>` : ""}
      <div class="row">
        ${wInput("mw-" + ex.id, v.weight, "Weight (kg)")}
        <div class="field" style="max-width:120px"><label for="mr-${ex.id}">Reps</label><input id="mr-${ex.id}" value="${esc(v.reps)}" placeholder="reps"></div>
      </div>
      <button class="btn" style="background:var(--max);color:#fff" data-max="${ex.id}">Update max</button>
      ${hist.length ? `<div class="hist"><span class="label" style="color:var(--muted)">Earlier</span>${hist.map(h => `<span class="num">${esc(maxText(h) || "—")} · ${esc(fmtDate(h.date, { day: "numeric", month: "short", year: "2-digit" }))}</span>`).join("")}</div>` : ""}
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <div class="row"><span class="label grow">Personal records</span>${lib ? `<button class="btn ghost small" data-go="lib-${lib.id}">All PRs →</button>` : ""}</div>
      ${prs.length ? `<div style="overflow-x:auto"><table class="prt"><thead><tr><th>Reps</th><th>Best</th><th>Date</th></tr></thead><tbody>${prs.map(p => `<tr><td>${esc(p.r)}</td><td class="w">${esc(fmtW(p.w))}</td><td class="d">${esc(fmtDate(p.date, { day: "numeric", month: "short", year: "2-digit" }))}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted" style="margin:0;font-size:.88rem">No PRs yet. Finish a workout or log one in Exercises.</p>`}
    </div>
  </article>`;
}

let timerEnd = 0, timerInt = null;
function timerHtml() {
  const left = Math.max(0, Math.ceil((timerEnd - Date.now()) / 1000));
  const t = timerEnd ? `${Math.floor(left / 60)}:${pad2(left % 60)}` : "0:00";
  return `<div class="card pad timer"><span class="label" style="width:100%">Rest timer</span><span class="t ${timerEnd && !left ? "done" : ""}" id="tval">${t}</span>
    ${[60, 90, 120].map(s => `<button class="btn ghost small" data-rest="${s}">${s < 120 ? s + " s" : "2 min"}</button>`).join("")}
    ${timerEnd ? '<button class="btn ghost small" data-rest="0">Stop</button>' : ""}</div>`;
}
function tickTimer() {
  const el = document.getElementById("tval"); if (!el) return;
  const left = Math.max(0, Math.ceil((timerEnd - Date.now()) / 1000));
  el.textContent = `${Math.floor(left / 60)}:${pad2(left % 60)}`;
  if (!left) { el.classList.add("done"); clearInterval(timerInt); timerInt = null; try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch {} toast("Rest over. Next set!"); }
}

function viewEx(r) {
  const day = dayById(r.day); if (!day) return viewHome();
  const f = findEx(day, r.ex); if (!f) return viewDay({ day: r.day });
  const run = runOf(f.sec, f.i);
  const bl = blocks(day), bi = bl.findIndex(b => b.items.includes(f.ex));
  const prev = bl[bi - 1], next = bl[bi + 1];
  const live = S.active && S.active.dayId === day.id;
  return `<div class="wrap">
    <div class="top"><button class="iconbtn" data-go="day-${day.id}" aria-label="Back">←</button><span class="title">${esc(day.name)} · ${esc(f.sec.title)}</span></div>
    ${run.length > 1 ? `<div class="sstip" style="--dc:${META[day.id].color}"><b>Superset.</b> Do one set of each exercise back-to-back, then rest. Repeat for all sets.</div>` : ""}
    ${run.map(ex => exPanel(day, ex, run.length > 1)).join("")}
    ${live ? timerHtml() : `<button class="btn ghost" id="start">Start ${esc(day.name)} to tick off sets</button>`}
    <div class="pager">
      ${prev ? `<button class="btn ghost" data-go="ex-${day.id}-${prev.items[0].id}"><span>← ${esc(cur(prev.items[0]).name)}</span></button>` : ""}
      ${next ? `<button class="btn" data-go="ex-${day.id}-${next.items[0].id}"><span>${esc(cur(next.items[0]).name)} →</span></button>` : `<button class="btn" data-go="day-${day.id}"><span>Back to workout</span></button>`}
    </div>
  </div>${tabs("home")}`;
}

function viewCalendar() {
  const now = new Date();
  if (!calMonth) calMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  const first = weekStart(calMonth), t = today();
  const m = calMonth.getMonth();
  let grid = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map(d => `<span class="h">${d.slice(0, 2)}</span>`).join("");
  for (let i = 0; i < 42; i++) {
    const d = addDays(first, i); if (i === 35 && d.getMonth() !== m) break;
    const k = dkey(d), es = S.log.filter(e => e.date === k);
    grid += `<button class="cell ${d.getMonth() !== m ? "out" : ""} ${k === t ? "today" : ""} ${k === calSel ? "sel" : ""}" data-day="${k}" aria-label="${esc(fmtDate(k, { weekday: "long", day: "numeric", month: "long" }))}${es.length ? ", " + es.length + " workout(s)" : ""}"><span class="n">${d.getDate()}</span><span class="dots">${pips(es)}</span></button>`;
  }
  const sel = S.log.filter(e => e.date === calSel);
  const monthCount = S.log.filter(e => parseKey(e.date).getMonth() === m && parseKey(e.date).getFullYear() === calMonth.getFullYear()).length;
  // last 4 weeks summary
  let weeks = "";
  for (let w = 0; w < 4; w++) {
    const ws = addDays(weekStart(now), -7 * w), es = weekEntries(ws);
    weeks += `<div class="weekrow"><span class="muted num">${w === 0 ? "This week" : "w/c " + ws.toLocaleDateString("en-GB", { day: "numeric", month: "short" })}</span><span class="dots" style="justify-content:flex-start">${strengthDays().map(d => { const hit = es.some(e => e.dayId === d.id); return `<span class="pip" style="--dc:${hit ? META[d.id].color : "var(--line)"};width:auto;padding:0 6px;height:20px;font-size:.66rem">${hit ? "✓ " : ""}${esc(d.short || d.name)}</span>`; }).join("")}${es.filter(e => !strengthDays().some(d => d.id === e.dayId)).length ? pips(es.filter(e => !strengthDays().some(d => d.id === e.dayId))) : ""}</span></div>`;
  }
  return `<div class="wrap">
    <div class="top"><span class="title">Workout log</span></div>
    <section class="card pad" style="display:flex;flex-direction:column;gap:10px"><h3>Strength, last 4 weeks</h3><div>${weeks}</div></section>
    <section class="card pad" style="display:flex;flex-direction:column;gap:12px">
      <div class="calnav"><button class="iconbtn" id="pm" aria-label="Previous month">‹</button><h2>${calMonth.toLocaleDateString("en-GB", { month: "long", year: "numeric" })}</h2><button class="iconbtn" id="nm" aria-label="Next month">›</button></div>
      <div class="cal">${grid}</div>
      <div class="legend">${S.days.map(d => `<span><span class="pip" style="--dc:${META[d.id].color}">${META[d.id].letter}</span>${esc(d.name)}</span>`).join("")}</div>
      <span class="muted num" style="font-size:.84rem">${monthCount} workout${monthCount === 1 ? "" : "s"} this month</span>
    </section>
    <section class="section"><span class="label">${esc(fmtDate(calSel, { weekday: "long", day: "numeric", month: "long" }))}</span>
      ${sel.length ? sel.map(entryCard).join("") : `<p class="muted" style="margin:0">No workout logged on this day.</p>`}
      <span class="label">Log a workout on this day</span>
      <div class="row">${S.days.map(d => `<button class="btn small daycol" style="--dc:${META[d.id].color}" data-logon="${d.id}">+ ${esc(d.name)}</button>`).join("")}</div>
      <p class="muted" style="margin:0;font-size:.84rem">Opens the session so you can enter sets and weights. Finish it to save it on this date.</p>
    </section>
    <section class="section"><span class="label">All workouts · ${S.log.length}</span>
      ${S.log.length ? [...S.log].sort((a, b) => (b.date + (b.at || "")).localeCompare(a.date + (a.at || ""))).slice(0, histLimit).map(entryCard).join("") : `<p class="muted" style="margin:0">Finished workouts are saved here with every set.</p>`}
      ${S.log.length > histLimit ? `<button class="btn ghost" id="more">Show older workouts</button>` : ""}
    </section>
  </div>${tabs("calendar")}`;
}

let histLimit = 20, libQuery = "";
function entryCard(e) {
  const d = dayById(e.dayId), m = META[e.dayId] || { color: "var(--muted)", letter: "?" };
  const items = (e.items || []).map(it => {
    if (Array.isArray(it.sets)) return `<li><b>${esc(it.name)}</b>${(it.prs || []).length ? ' <span class="prbadge">PR</span>' : ""}<br><span class="num">${esc(it.sets.map(setText).filter(Boolean).join(" · ") || it.sets.length + " sets")}</span></li>`;
    return `<li><b>${esc(it.name)}</b>${it.of ? ` <span>${it.sets}/${it.of} sets</span>` : ""}${it.max ? ` <span class="red">${esc(it.max)}</span>` : ""}</li>`;
  }).join("");
  return `<div class="card entry hist-entry"><span class="pip" style="--dc:${m.color}">${m.letter}</span><div class="grow"><b>${esc(d ? d.name : e.dayId)}</b> <span class="muted" style="font-size:.84rem">${esc(fmtDate(e.date, { weekday: "short", day: "numeric", month: "short", year: "numeric" }))}</span>${items ? `<ul>${items}</ul>` : `<div class="muted" style="font-size:.86rem">Logged as done</div>`}</div><button class="btn danger small" data-dellog="${e.id}" aria-label="Remove workout">✕</button></div>`;
}

function viewLib() {
  const list = [...S.lib].sort((a, b) => a.name.localeCompare(b.name));
  return `<div class="wrap">
    <div class="top"><span class="title">Exercises</span><button class="iconbtn" id="newlib">+ New</button></div>
    <div class="field"><label for="libq">Search ${S.lib.length} exercises</label><input id="libq" type="search" value="${esc(libQuery)}" placeholder="Squat, row, jump…" autocomplete="off"></div>
    <div class="list" id="liblist">${list.map(l => {
      const u = usedIn(l.name), sum = libSummary(l);
      return `<button class="card libitem" data-go="lib-${l.id}" data-name="${esc(norm(l.name))}"><b>${esc(l.name)}</b><span class="mx">${esc(sum)}</span>
        <small>${l.prs.length ? `${l.prs.length} PR${l.prs.length === 1 ? "" : "s"}` : "No PRs yet"}${u.length ? " · " + esc([...new Set(u.map(x => x.day.short || x.day.name))].join(", ")) : ""}</small><span></span></button>`;
    }).join("")}</div>
  </div>${tabs("lib")}`;
}

function viewLibEx(r) {
  const l = S.lib.find(x => x.id === r.id); if (!l) return viewLib();
  const u = usedIn(l.name), table = prTable(l);
  const all = [...l.prs].sort((a, b) => b.date.localeCompare(a.date));
  const sessions = [];
  [...S.log].sort((a, b) => (b.date + (b.at || "")).localeCompare(a.date + (a.at || ""))).forEach(e => (e.items || []).forEach(it => { if (norm(it.name) === norm(l.name) && Array.isArray(it.sets)) sessions.push({ e, it }); }));
  return `<div class="wrap">
    <div class="top"><button class="iconbtn" data-go="lib" aria-label="Back">←</button><span class="title">${esc(l.name)}</span><button class="iconbtn" id="renlib" data-id="${l.id}">Rename</button></div>
    ${u.length ? `<div class="chips">${u.map(x => `<button class="chip on" style="--dc:${META[x.day.id].color}" data-go="ex-${x.day.id}-${x.ex.id}">${esc(x.day.name)}</button>`).join("")}</div>` : `<p class="muted" style="margin:0">Not in the programme right now.</p>`}
    <section class="card pad" style="display:flex;flex-direction:column;gap:10px">
      <h3>Best by reps</h3>

function sheet(html, onReady) {

const closeSheet = () => document.getElementById("layer").innerHTML = "";

function swapSheet(day, ex) {
  const v = cur(ex);
  sheet(`<h3>Swap ${esc(v.name)}</h3>

    <datalist id="swnames">${[...S.lib].sort((a, b) => a.name.localeCompare(b.name)).filter(l => norm(l.name) !== norm(v.name)).map(l => `<option value="${esc(l.name)}"></option>`).join("")}</datalist>
    <div class="row"><div class="field"><label for="swsets">Sets × reps</label><input id="swsets" value="${esc(v.sets)}"></div><div class="field"><label for="swlabel">Movement</label><input id="swlabel" value="${esc(ex.label || "")}"></div></div>
    <button class="btn" id="swreplace">Replace ${esc(v.name)}</button>

    <button class="btn ghost" data-close="1">Cancel</button>
    <p class="muted" style="margin:0;font-size:.84rem">${esc(v.name)}'s PRs stay in your exercise database.</p>`, layer => {
    const i = layer.querySelector("#swname"); i.focus();
    const apply = mode => {
      const raw = i.value.trim(); if (!raw) { i.focus(); toast("Pick or type an exercise"); return; }
      const l = ensureLib(raw), name = l.name, sets = layer.querySelector("#swsets").value.trim() || v.sets;
      const nv = V(name, sets);
      const tr = targetReps(nv), best = (tr ? l.prs.filter(p => String(p.r) === tr).sort((a, b) => parseW(b.w).kg - parseW(a.w).kg)[0] : null) || [...l.prs].sort((a, b) => b.date.localeCompare(a.date))[0];
      if (best) { nv.weight = best.w; nv.reps = best.r; nv.maxDate = best.date; } else nv.maxDate = "";
      if (mode === "replace") ex.variants[ex.cur || 0] = nv; else { ex.variants.push(nv); ex.cur = ex.variants.length - 1; }
      ex.label = layer.querySelector("#swlabel").value.trim();
      if (S.active && S.active.sets) delete S.active.sets[ex.id];

    };

  });
}

/* ---------- actions ---------- */
function startDay(day, date) {
  date = date || today();
  const begin = () => { S.active = { dayId: day.id, date, at: new Date().toISOString(), sets: {} }; save(); if (route().day === day.id) render(); else go("day-" + day.id); toast(date === today() ? `${day.name} started` : `Logging ${day.name} for ${fmtDate(date)}`); };
  if (S.active && (S.active.dayId !== day.id || S.active.date !== date)) ask(`Discard the ${dayById(S.active.dayId)?.name || ""} workout in progress?`, "Discard & start", begin);
  else begin();
}
function logEntry(dayId, date, items) {
  S.log.push({ id: uid(), date, dayId, at: new Date().toISOString(), items: items || [] });
}
function finishDay(day) {
  const date = S.active.date || today();
  let prCount = 0;
  const items = allEx(day).filter(e => setsDone(e.id) > 0).map(e => {
    const v = cur(e), sets = getSets(e.id).filter(x => x && x.done).map(x => ({ w: x.w, r: x.r }));
    const prs = [];
    // best set per rep count goes to the exercise database if it beats the record
    const best = {};
    sets.forEach(x => { const k = prKey(x.w, x.r); if (k && String(x.r).trim() && (!best[k] || parseW(x.w).kg > parseW(best[k].w).kg)) best[k] = x; });
    Object.values(best).forEach(x => { if (addPR(v.name, x.w, x.r, date)) prs.push(setText(x)); });
    prCount += prs.length;
    return { name: v.name, label: e.label || "", sets, prs };
  });
  logEntry(day.id, date, items);
  S.active = null; save(); calSel = date; calMonth = null;
  toast(prCount ? `${day.name} logged · ${prCount} new PR${prCount === 1 ? "" : "s"} 🏆` : `${day.name} logged`); go("calendar");
}
function moveEx(day, exId, dir) {
  const f = findEx(day, exId); if (!f) return;
  const si = day.sections.indexOf(f.sec);
  f.ex.group = null;
  f.sec.items.splice(f.i, 1);
  if (dir < 0) {
    if (f.i > 0) f.sec.items.splice(f.i - 1, 0, f.ex);
    else day.sections[si - 1].items.push(f.ex);
  } else {
    if (f.i < f.sec.items.length) f.sec.items.splice(f.i + 1, 0, f.ex);
    else day.sections[si + 1].items.unshift(f.ex);
  }
  day.sections.forEach(cleanGroups);
  save(); render();
}
function toggleLink(day, exId) {
  const f = findEx(day, exId); if (!f) return;
  const a = f.ex, b = f.sec.items[f.i + 1]; if (!b) return;
  if (a.group && a.group === b.group) {
    const g2 = "g" + uid();
    for (let j = f.i + 1; j < f.sec.items.length && f.sec.items[j].group === a.group; j++) f.sec.items[j].group = g2;
  } else {
    const g = a.group || b.group || "g" + uid();
    const old = b.group;
    a.group = g;
    if (old && old !== g) f.sec.items.forEach(e => { if (e.group === old) e.group = g; }); else b.group = g;
  }
  cleanGroups(f.sec); save(); render();
}

function render() {
  const r = route();
  const app = document.getElementById("app");
  app.innerHTML = r.name === "day" ? viewDay(r) : r.name === "ex" ? viewEx(r) : r.name === "calendar" ? viewCalendar() : r.name === "backup" ? viewBackup() : r.name === "lib" ? viewLib() : r.name === "libex" ? viewLibEx(r) : viewHome();
  document.title = "AW/26 Training";
}

function updSet(exId, i) { // read a set row's inputs into the session
  if (!S.active) return [];
  S.active.sets = S.active.sets || {};
  const day = dayById(S.active.dayId), f = day && findEx(day, exId); if (!f) return [];
  const arr = liveSets(exId, cur(f.ex));
  const wEl = document.getElementById(`sw-${exId}-${i}`), rEl = document.getElementById(`sr-${exId}-${i}`);
  if (wEl) arr[i].w = readW(`sw-${exId}-${i}`);
  if (rEl) arr[i].r = rEl.value.trim();
  arr[i].touched = true;
  // later sets you haven't touched follow this one
  for (let j = i + 1; j < arr.length; j++) {
    if (arr[j].done || arr[j].touched) continue;
    arr[j].w = arr[i].w; arr[j].r = arr[i].r;
    const w2 = document.getElementById(`sw-${exId}-${j}`), r2 = document.getElementById(`sr-${exId}-${j}`), p = parseW(arr[j].w);
    if (w2) { w2.value = p ? (p.bw ? (p.kg || "") : p.kg) : arr[j].w; const bt = w2.previousElementSibling; bt.classList.toggle("on", !!(p && p.bw)); w2.placeholder = p && p.bw ? "+ kg" : "kg"; }
    if (r2) r2.value = arr[j].r;
  }
  S.active.sets[exId] = arr; save();
  return arr;
}
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset && t.dataset.sx) { updSet(t.dataset.sx, +t.dataset.si); return; }
  if (t.id === "libq") {
    libQuery = t.value; const q = norm(t.value);
    document.querySelectorAll("#liblist [data-name]").forEach(b => { b.hidden = q && !b.dataset.name.includes(q); });
  }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.closest && e.target.closest(".sheet") && e.target.tagName === "INPUT") { const b = e.target.closest(".sheet").querySelector("#addgo, #nlgo, #rngo, #swreplace"); if (b) b.click(); } });

document.addEventListener("click", e => {
  const t = e.target.closest("button, a"); if (!t || t.tagName === "A") return;
  const r = route(), day = r.day ? dayById(r.day) : null, d = t.dataset;
  if (d.go !== undefined) { go(d.go); return; }
  if (t.id === "edit") { editMode = !editMode; render(); return; }
  if (t.id === "start" && day) { startDay(day); return; }
  if (t.id === "quicklog" && day) { logEntry(day.id, today(), day.kind === "cardio" ? [{ name: cur(day.sections[0].items[0]).name }] : []); save(); toast(`${day.name} logged for today`); calSel = today(); calMonth = null; go("calendar"); return; }
  if (t.id === "finish" && day) { const any = allEx(day).some(x => setsDone(x.id)); if (any) finishDay(day); else ask("No sets ticked yet. Log the workout anyway?", "Log it", () => finishDay(day), false); return; }
  if (t.id === "discard" && day) { ask("Discard this workout? Nothing will be logged.", "Discard", () => { S.active = null; save(); render(); }); return; }
  if (d.mv && day) { moveEx(day, d.mv, +d.dir); return; }
  if (d.link && day) { toggleLink(day, d.link); return; }
  if (d.add && day) { addExerciseSheet(day, day.sections.find(s => s.id === d.add)); return; }
  if (d.bwt) {
    const inp = document.getElementById(d.bwt); t.classList.toggle("on"); t.setAttribute("aria-pressed", t.classList.contains("on")); if (inp) inp.placeholder = t.classList.contains("on") ? "+ kg" : "kg";
    if (inp && inp.dataset.sx) updSet(inp.dataset.sx, +inp.dataset.si);
    return;
  }
  if (d.step && day) {
    const f = findEx(day, d.step), v = cur(f.ex);
    v.count = Math.max(1, Math.min(12, (v.count || 1) + +d.dir));
    if (S.active && S.active.sets && S.active.sets[f.ex.id] && S.active.sets[f.ex.id].length > v.count) S.active.sets[f.ex.id] = S.active.sets[f.ex.id].slice(0, v.count);
    save(); render(); return;
  }
  if (d.chk && day && S.active) {
    const i = +d.i, arr = updSet(d.chk, i), st = arr[i];
    st.done = !st.done; save(); render();
    if (st.done) {
      const v = cur(findEx(day, d.chk).ex);
      if (String(st.r).trim() && parseW(st.w) && beats(libByName(v.name), st.w, st.r)) toast(`New PR: ${setText(st)} 🏆`);
      if (!timerInt) { timerEnd = Date.now() + 90000; timerInt = setInterval(tickTimer, 250); render(); }
    }

  }
  if (d.var && day) { const f = findEx(day, d.var); f.ex.cur = +d.i; save(); render(); return; }
  if (d.editex) { exEdit = d.editex; render(); return; }
  if (d.swap && day) { swapSheet(day, findEx(day, d.swap).ex); return; }
  if (d.cancel) { exEdit = null; render(); return; }
  if (d.save && day) {
    const f = findEx(day, d.save), v = cur(f.ex), val = id => document.getElementById(id + "-" + f.ex.id).value;
    v.name = val("f-name").trim() || v.name; v.sets = val("f-sets").trim(); { const l = ensureLib(v.name); if (l) v.name = l.name; }
    v.count = Math.max(1, Math.min(12, parseInt(val("f-count"), 10) || 1)); v.notes = val("f-notes").trim();

  }
  if (d.addvar && day) { const f = findEx(day, d.addvar); f.ex.variants.push(V("Alternative exercise", cur(f.ex).sets || "3×10")); exEdit = f.ex.id; f.ex.cur = f.ex.variants.length - 1; save(); render(); const i = document.getElementById("f-name-" + f.ex.id); if (i) { i.focus(); i.select(); } return; }
  if (d.delvar && day) { const f = findEx(day, d.delvar); ask(`Remove “${cur(f.ex).name}” from this exercise?`, "Remove", () => { f.ex.variants.splice(f.ex.cur || 0, 1); f.ex.cur = 0; save(); render(); }); return; }
  if (d.delex && day) { const f = findEx(day, d.delex); ask(`Delete “${cur(f.ex).name}” from ${day.name}?`, "Delete", () => { f.sec.items.splice(f.i, 1); cleanGroups(f.sec); exEdit = null; save(); go("day-" + day.id); }); return; }
  if (d.max && day) {

    if (v.weight || v.reps) (v.history = v.history || []).push({ weight: v.weight, reps: v.reps, date: v.maxDate || today() });
    v.weight = w; v.reps = rp; v.maxDate = today();
    const pr = w && rp && addPR(v.name, w, rp, today());
    save(); render(); toast(pr ? "New max and PR saved 🏆" : "Max saved 💪"); return;
  }
  if (d.rest !== undefined) { clearInterval(timerInt); timerInt = null; timerEnd = +d.rest ? Date.now() + d.rest * 1000 : 0; if (timerEnd) timerInt = setInterval(tickTimer, 250); render(); return; }
  if (t.id === "pm" || t.id === "nm") { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + (t.id === "pm" ? -1 : 1), 1); render(); return; }
  if (d.day) { calSel = d.day; render(); return; }
  if (d.logon) { startDay(dayById(d.logon), calSel); return; }
  if (t.id === "more") { histLimit += 30; render(); return; }
  if (t.id === "newlib") {

      layer.querySelector("#rngo").onclick = () => {

  if (d.dellog) { ask("Remove this workout from the log?", "Remove", () => { S.log = S.log.filter(x => x.id !== d.dellog); save(); render(); }); return; }
  if (t.id === "bk-copy") { const ta = document.getElementById("bk-out"); navigator.clipboard?.writeText(ta.value).then(() => toast("Backup copied"), () => { ta.focus(); ta.select(); toast("Select all and copy"); }) ?? (ta.select(), toast("Select all and copy")); return; }
  if (t.id === "bk-restore") { try { const r2 = JSON.parse(document.getElementById("bk-in").value); if (!r2 || !Array.isArray(r2.days) || !Array.isArray(r2.log)) throw 0; ask("Replace everything on this device with the backup?", "Restore", () => { S = migrate(r2); save(); go(""); toast("Backup restored"); }); } catch { toast("That text isn't a valid backup"); } return; }
  if (t.id === "reset") { ask("Reset the programme to the original? Your log is kept.", "Reset", () => { const fresh = seed(); fresh.log = S.log; fresh.lib = S.lib; S = migrate(fresh); save(); go(""); toast("Programme reset"); }); return; }
});

if (migratePending) { S = migrate(S); migratePending = false; persistLocal(); }
render();
})();
</script>
